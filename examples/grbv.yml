# Style for the grapevine red blotch virus example (examples/grbv.gff3).
#
# Colour encodes predicted function, never strand (ICTV convention; see
# docs/ictv_drawing_conventions.md). The RefSeq product names ("V1 protein")
# carry no function, so each ORF is pinned here to its class colour from the
# default palette; "putative" roles take the lighter tint.
#   V1      coat protein                        -> capsid
#   C1, C2  Rep (C1 = RepA; C1:C2 spliced = Rep) -> replicase, C2 lighter
#   V2, V3  proposed movement-associated roles  -> movement, lighter tint
#   C3      no assigned function                -> unknown

color_mapping:
  V1 protein: '#e75480'
  C1 protein: '#f5b041'
  C2 protein: '#f8ca80'
  V2 protein: '#82c5cf'
  V3 protein: '#82c5cf'
  C3 protein: '#9f9f9f'

annotation_fontsize: 9
default_color: '#9f9f9f'
shade_color: '#ca4f35'
depth_line_color: '#85dbec'   # the original figure's top layer (sample 1)
stacked_area_colors: ['#567eb0', '#55b9d9', '#85dbec']   # bottom layer first
legend_location: "upper left"

# overlap_mode: auto   # auto = tier when ORFs sit on both strands (they do here)
title: ""              # empty -> "NC_022002.1 (3,206 nts)" when --title is given
