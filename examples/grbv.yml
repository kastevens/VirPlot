# Style for the grapevine red blotch virus example (examples/grbv.gff3).
#
# No color_mapping is needed: the GFF's curated products name their function
# (CP, RepA, Rep, putative MP), so the default function palette colours them
# — capsid magenta, replicase yellow, movement teal lightened by "putative".
# V3 and C3 have no assigned function and stay default_color, as intended.
annotation_fontsize: 9
default_color: '#9f9f9f'
shade_color: '#ca4f35'
depth_line_color: '#85dbec'
stacked_area_colors: ['#567eb0', '#55b9d9', '#85dbec']
legend_location: "upper left"
title: ""              # empty -> "NC_022002.1 (3,206 nts)" when --title is given
