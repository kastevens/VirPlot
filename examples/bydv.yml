# Style for the BYDV-PAV example (examples/bydv.gff3), following ICTV 9th
# Report Luteoviridae Fig. 2. Colours were sampled from the figure; the same
# palette serves PLRV (examples/plrv.yml). The figure writes ORF numbers
# inside the boxes, so here product= carries the ORF name.

color_mapping:
  ORF0: '#b4cc84'
  ORF1: '#d48c6c'
  ORF2: '#f4d46c'
  ORF3: '#d494b4'
  ORF4: '#94c4dc'
  ORF5: '#b4cc84'
  ORF6: '#9c9c9c'

annotation_fontsize: 9
default_color: '#9f9f9f'
shade_color: '#ca4f35'
depth_line_color: '#85dbec'
stacked_area_colors: ['#567eb0', '#55b9d9', '#85dbec']
legend_location: "upper left"
end_5_label: "5'"
end_3_label: "3' OH"
title: "Luteovirus, BYDV-PAV (5,677 nts)"
