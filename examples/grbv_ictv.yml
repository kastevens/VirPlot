# examples/grbv.yml restyled the way the ICTV 9th Report draws circular
# genomes: level "ORF (product)" labels outside the ring and the innermost
# arcs sitting on the genome circle. Everything else is as in grbv.yml.
annotation_fontsize: 9
default_color: '#9f9f9f'
shade_color: '#ca4f35'
depth_line_color: '#85dbec'
stacked_area_colors: ['#567eb0', '#55b9d9', '#85dbec']
legend_location: "upper left"
title: ""

circular_labels: horizontal     # tangential (default) | horizontal
circular_arcs: on_circle        # outside (default)    | on_circle
