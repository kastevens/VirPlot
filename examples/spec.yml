color_mapping:
  Methyltransferase/helicase: '#ffb55a'
  RdRp: '#ffee65'
  HSP70h: '#b2e061'
  HSP90h: '#fdcce5'
  CPh: '#77affd'
  CP: '#fd7f6f'
  MP: '#7eb0d5'
  CPm: '#f7cac9'
  p20: '#8bd3c7'
  p22: '#8bd3c7'
  p24: '#8bd3c7'
  p26: '#8bd3c7'
  p47: '#f7cac9'
  Unknown Protein: '#beb9db'
  # Add more mappings as needed

annotation_fontsize: 9

default_color: '#9f9f9f'

shade_color: '#ca4f35'

depth_line_color: '#55b9d9'   # the original figure's middle layer; drawn at alpha 0.9 under a thin black line

stacked_area_colors:            # bottom layer first; these are the original README figure's colours
  - '#567eb0'
  - '#55b9d9'
  - '#85dbec'
  # Add more if there are more depth files
  # Will pad with default_color if missing

legend_location: "upper left"

title: ""

# --- ICTV drawing conventions (docs/ictv_drawing_conventions.md) -------------
# Products not listed in color_mapping are coloured by function class, guessed
# from their name (RdRp/Rep -> replicase, CP -> capsid, MP -> movement, HSP70h,
# 'silencing suppressor'). A bare pNN name stays default_color: map it here.
# Override a class colour if you wish:
# function_palette:
#   replicase: '#f5b041'
#   capsid: '#e75480'
#   movement: '#3ea6b5'
#   hsp70: '#7dbb4f'
#   suppressor: '#9b6fc4'
#   unknown: '#9f9f9f'

# How overlapping ORFs are placed on the linear track:
#   auto  flip across the line for one-strand genomes, tier by strand otherwise
#   flip  always flip (mode L1)      tier  always + above / - below (mode L2)
overlap_mode: auto

# End marks on a linear genome, e.g. "5' m7G" / "A(n)", or "VPg" for the oval
end_5_label: "5'"
end_3_label: "3'"
