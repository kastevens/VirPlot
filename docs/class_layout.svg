<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650" width="1040" height="650" role="img"
     aria-label="VirPlot class layout: parsers build RNA objects (with Feature lists, depth tracks and a Topology); a Plotter base class with LinearPlotter now and CircularPlotter planned renders each RNA; analysis stays as pure functions; cli orchestrates."
     font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="12" style="color:#222">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/>
    </marker>
    <marker id="inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#fff" stroke="currentColor" stroke-width="1.2"/>
    </marker>
    <marker id="inheritp" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#fff" stroke="#1f6fb2" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="1040" height="650" fill="#fff"/>

  <!-- title + legend -->
  <text x="40" y="32" font-size="15" font-weight="700" fill="currentColor">VirPlot — class layout</text>
  <g font-size="11" fill="currentColor">
    
    
    
  </g>

  <!-- ===== column 1: inputs ===== -->
  <g stroke="currentColor" fill="none" stroke-width="1.2">
    <rect x="40" y="80" width="110" height="44"/>
    <rect x="48" y="146" width="110" height="44"/>
    <rect x="44" y="143" width="110" height="44" fill="#fff"/>
    <rect x="40" y="140" width="110" height="44" fill="#fff"/>
    <rect x="40" y="560" width="110" height="44"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11">
    <text x="95" y="106">genome.gff</text>
    <text x="95" y="166" font-size="10">dep · sam · bam</text>
    <text x="95" y="586">spec.yaml</text>
  </g>

  <!-- ===== column 2: parsers ===== -->
  <g stroke="currentColor" fill="none" stroke-width="1.2">
    <rect x="210" y="80" width="130" height="44" rx="4"/>
    <rect x="210" y="140" width="130" height="44" rx="4"/>
    <rect x="210" y="560" width="130" height="44" rx="4"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11">
    <text x="275" y="106">parse_gff_rnas()</text>
    <text x="275" y="166">load_depth()</text>
    <text x="275" y="586">load_settings()</text>
  </g>
  <g stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)">
    <line x1="150" y1="102" x2="209" y2="102"/>
    <line x1="150" y1="162" x2="209" y2="162"/>
    <line x1="150" y1="582" x2="209" y2="582"/>
  </g>

  <!-- ===== column 3: model ===== -->
  <!-- list[RNA] shadow card (planned) -->
  <rect x="424" y="46" width="220" height="190" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="650" y="56" font-size="11" fill="currentColor">list[RNA] — one per GFF region</text>

  <!-- RNA -->
  <rect x="410" y="60" width="220" height="190" fill="#fff" stroke="currentColor" stroke-width="1.4"/>
  <line x1="410" y1="84" x2="630" y2="84" stroke="currentColor" stroke-width="1.2"/>
  <text x="520" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">RNA</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="currentColor">
    <text x="420" y="102">name: str</text>
    <text x="420" y="118">seqid, length</text>
    <text x="420" y="134">features: list[Feature]</text>
    <text x="420" y="150">depth: list[DepthTrack]</text>
    <text x="420" y="166">circular: bool</text>
  </g>
  <line x1="410" y1="176" x2="630" y2="176" stroke="currentColor" stroke-width="0.8"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="currentColor">
    <text x="420" y="194">positions → ndarray</text>
    <text x="420" y="210">total_depth() → ndarray</text>
    <text x="420" y="226">add_depth(label, y)</text>
    <text x="420" y="242">feature_spans(feat)</text>
  </g>

  <!-- parsers -> RNA -->
  <g stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)">
    <line x1="340" y1="102" x2="409" y2="102"/>
    <line x1="340" y1="162" x2="409" y2="162"/>
  </g>
  <g font-size="10" fill="currentColor" text-anchor="middle">
    <text x="375" y="96">list[RNA]</text>
    <text x="375" y="156">add_depth</text>
  </g>

  <!-- Feature -->
  <rect x="410" y="290" width="220" height="92" fill="#fff" stroke="currentColor" stroke-width="1.4"/>
  <line x1="410" y1="314" x2="630" y2="314" stroke="currentColor" stroke-width="1.2"/>
  <text x="520" y="307" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Feature <tspan font-weight="400" font-size="11">(frozen)</tspan></text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="currentColor">
    <text x="420" y="332">start, end: int</text>
    <text x="420" y="348">strand, product: str</text>
    <text x="420" y="372">length, midpoint</text>
  </g>
  <line x1="410" y1="356" x2="630" y2="356" stroke="currentColor" stroke-width="0.8"/>
  <line x1="520" y1="250" x2="520" y2="289" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="527" y="274" font-size="10" fill="currentColor">1..*</text>

  <!-- Topology (planned) -->
  <rect x="410" y="420" width="220" height="60" fill="#fff" stroke="currentColor" stroke-width="1.4"/>
  <line x1="410" y1="444" x2="630" y2="444" stroke="currentColor" stroke-width="1.2"/>
  <text x="520" y="437" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">circular: bool</text>
  <text x="420" y="462" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="currentColor">from GFF Is_circular=true</text>
  <text x="420" y="476" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="currentColor">depth wraps · features split</text>

  
  
  
  
  
  <!-- RNA -> Topology, routed down the left edge -->
  <polyline points="410,236 392,236 392,450 409,450" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="386" y="345" font-size="10" fill="currentColor" text-anchor="end" transform="rotate(-90 386 345)">topology</text>

  <!-- Settings -->
  <rect x="410" y="560" width="220" height="44" fill="#fff" stroke="currentColor" stroke-width="1.4"/>
  <text x="520" y="578" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Settings</text>
  <text x="520" y="595" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="currentColor">colors · fontsize · legend · title</text>
  <line x1="340" y1="582" x2="409" y2="582" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== column 4: rendering ===== -->
  <!-- Plotter base -->
  <rect x="720" y="60" width="240" height="112" fill="#fff" stroke="currentColor" stroke-width="1.4"/>
  <line x1="720" y1="84" x2="960" y2="84" stroke="currentColor" stroke-width="1.2"/>
  <text x="840" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Plotter <tspan font-weight="400" font-size="11">(base)</tspan></text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="currentColor">
    <text x="730" y="102">settings: Settings</text>
    <text x="730" y="118">shared_ymax · max_length</text>
    <text x="730" y="142">prepare(rnas) · render(rna, …)</text>
    <text x="730" y="158">_prepared_tracks() · _save()</text>
  </g>
  <line x1="720" y1="126" x2="960" y2="126" stroke="currentColor" stroke-width="0.8"/>

  <!-- RNA -> Plotter -->
  <line x1="630" y1="140" x2="719" y2="140" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="675" y="134" font-size="10" fill="currentColor" text-anchor="middle">render(rna)</text>

  <!-- subclasses -->
  <rect x="720" y="222" width="110" height="88" fill="#fff" stroke="currentColor" stroke-width="1.4"/>
  <text x="775" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">LinearPlotter</text>
  <g font-size="10" fill="currentColor" text-anchor="middle">
    <text x="775" y="258">2 stacked axes</text>
    <text x="775" y="272">annotation track</text>
    <text x="775" y="286">depth track</text>
    <text x="775" y="300">5′ / 3′ marks</text>
  </g>
  <rect x="850" y="222" width="110" height="88" fill="#fff" stroke="currentColor" stroke-width="1.4"/>
  <text x="905" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">CircularPlotter</text>
  <g font-size="10" fill="currentColor" text-anchor="middle">
    <text x="905" y="258">1 polar axes</text>
    <text x="905" y="272">outer band: features</text>
    <text x="905" y="286">inner band: depth</text>
    <text x="905" y="300">θ = 2π·pos/L</text>
  </g>
  <line x1="775" y1="222" x2="775" y2="173" stroke="currentColor" stroke-width="1.2" marker-end="url(#inherit)"/>
  <line x1="905" y1="222" x2="905" y2="173" stroke="currentColor" stroke-width="1.2" marker-end="url(#inherit)"/>
  <text x="840" y="200" text-anchor="middle" font-size="10" fill="currentColor">override _draw_annotations / _draw_depth</text>

  <!-- output -->
  <rect x="720" y="350" width="240" height="40" fill="#fff" stroke="currentColor" stroke-width="1.2" rx="4"/>
  <text x="840" y="374" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="currentColor">figure → .png / .svg / .pdf</text>
  <line x1="775" y1="310" x2="775" y2="349" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="905" y1="310" x2="905" y2="349" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- analysis (pure functions) -->
  <rect x="720" y="430" width="240" height="70" fill="#fff" stroke="currentColor" stroke-width="1.2" rx="4"/>
  <text x="840" y="448" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">analysis.py <tspan font-weight="400" font-size="11">(pure functions, unchanged)</tspan></text>
  <text x="840" y="468" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="currentColor">smooth_depth(y)  call_blocks(y, T)</text>
  <text x="840" y="486" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="currentColor">write_csvs(intervals, gaps)</text>
  <!-- Plotter -> analysis, routed down the right edge -->
  <polyline points="960,150 990,150 990,465 961,465" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="996" y="310" font-size="10" fill="currentColor" text-anchor="middle" transform="rotate(90 996 310)">smooth_depth</text>

  <!-- cli -->
  <rect x="720" y="560" width="240" height="44" fill="#fff" stroke="currentColor" stroke-width="1.4"/>
  <text x="840" y="578" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">cli.main()</text>
  <text x="840" y="595" text-anchor="middle" font-size="10" fill="currentColor">for rna in rnas: call_blocks · render</text>
  <!-- Settings -> cli -->
  <line x1="630" y1="592" x2="719" y2="592" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- cli -> analysis -->
  <line x1="840" y1="560" x2="840" y2="501" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="846" y="534" font-size="10" fill="currentColor">call_blocks</text>
  <!-- cli -> Plotter (chooses subclass), routed up the left edge -->
  <polyline points="720,572 690,572 690,110 719,110" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="700" y="430" font-size="10" fill="currentColor" text-anchor="middle" transform="rotate(-90 700 430)">--layout picks the plotter</text>

  <!-- footnote -->
  <text x="40" y="636" font-size="11" fill="currentColor">Multiple RNAs → one figure each, shared y-limit and length-proportional width. Circular genomes wrap depth at the origin; --layout circular draws them on polar axes.</text>
</svg>
