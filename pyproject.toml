[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virplot"
version = "2.2.0"
description = "Viral genome feature annotation and depth plotting tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["matplotlib", "pyyaml", "numpy"]
authors = [
    {name = "Haoran Li", email = "lhrli@ucdavis.edu"},
]

[project.urls]
Repository = "https://github.com/ucdavis/VirPlot"

[project.scripts]
virplot = "virplot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
